/* ── Tokens: day = 1925 poster palette, night = black·green·gold ── */
:root{
  --bg:#EDE1D3;--bg2:#E5D5C4;--card:#F7EFE6;--ink:#1E1E1E;--ink2:#5E534A;
  --ln:#A8714F;--ln2:rgba(168,113,79,.38);--fa:#5E8C91;--fb:#B9D3D2;--fc:#E2B193;
  --pn:#D3E3E2;--pn2:#B9D3D2;--hd:#CFE0DF;--on:#F7EFE6;
  --ok:#2F6B61;--okbg:rgba(94,140,145,.16);--warn:#A3452A;--warnbg:rgba(226,177,147,.38);
  --nav:#1B1B1B;--navln:#E2B193;--shadow:rgba(30,30,30,.18);
  --serif:"Noto Serif TC","Songti TC","STSong","PMingLiU","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --deco:"Poiret",var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1512;--bg2:#0E1B17;--card:#0F1F1A;--ink:#F2E8D5;--ink2:#B5AC9C;
  --ln:#D4B26A;--ln2:rgba(212,178,106,.32);--fa:#163A30;--fb:#2F7A62;--fc:#D4B26A;
  --pn:#0E211C;--pn2:#16362D;--hd:#0B1512;--on:#0B1512;
  --ok:#86C9AE;--okbg:rgba(47,122,98,.22);--warn:#EBA27A;--warnbg:rgba(212,178,106,.14);
  --nav:#060C0A;--navln:#D4B26A;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1512;--bg2:#0E1B17;--card:#0F1F1A;--ink:#F2E8D5;--ink2:#B5AC9C;
  --ln:#D4B26A;--ln2:rgba(212,178,106,.32);--fa:#163A30;--fb:#2F7A62;--fc:#D4B26A;
  --pn:#0E211C;--pn2:#16362D;--hd:#0B1512;--on:#0B1512;
  --ok:#86C9AE;--okbg:rgba(47,122,98,.22);--warn:#EBA27A;--warnbg:rgba(212,178,106,.14);
  --nav:#060C0A;--navln:#D4B26A;--shadow:rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:12px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  transition:background .4s,color .4s;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;position:relative}
.deco{font-family:var(--deco);letter-spacing:.06em}
.serif{font-family:var(--serif)}
.gd{color:var(--ln)}
.mut{color:var(--ink2)}
svg{display:block}
.f-a{fill:var(--fa);stroke:var(--ln)} .f-b{fill:var(--fb)} .f-c{fill:var(--fc)} .s-ln{stroke:var(--ln);fill:none} .fl-ln{fill:var(--ln)} .fl-bg{fill:var(--bg)} .fl-hd{fill:var(--hd)}

/* chamfered shapes */
.chf{--c:10px;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.frame{background:var(--ln);padding:1px}
.frame>.in{background:var(--card);position:relative}
.frame>.in::before{content:"";position:absolute;inset:4px;border:1px solid var(--ln2);pointer-events:none;
  clip-path:inherit}

/* ── Section title ── */
.st{text-align:center;padding:44px 16px 20px}
.st .eb{font-family:var(--deco);font-size:12px;letter-spacing:.5em;color:var(--ln);margin-left:.5em}
.st h2{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.32em;margin:4px 0 8px .32em}
.st svg{margin:0 auto}

/* ── Hero ── */
.hero{position:relative;height:340px;overflow:hidden}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.plaque{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82%,330px)}
.plaque .in{padding:20px 12px 18px;text-align:center}
.plaque .eb{font-family:var(--deco);font-size:11px;letter-spacing:.45em;color:var(--ln)}
.plaque .zh{font-family:var(--serif);font-size:46px;font-weight:500;letter-spacing:.42em;margin:2px 0 -4px .42em;line-height:1.25}
.plaque .en{font-family:var(--deco);font-size:26px;letter-spacing:.42em;color:var(--ln);margin-left:.42em}
.plaque .dt{font-family:var(--deco);font-size:17px;letter-spacing:.18em;margin-top:2px}
.plaque .who{font-size:12px;letter-spacing:.3em;color:var(--ink2);margin-top:2px}
.corner{position:absolute;width:22px;height:22px}
.rule2{height:3px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}

/* status medallion */
.today{display:flex;align-items:center;gap:16px;margin:22px 16px 6px;padding:0;text-decoration:none}
.medal{position:relative;width:92px;height:92px;flex-shrink:0}
.medal svg{position:absolute;inset:0}
.medal b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--deco);font-weight:400;font-size:34px;line-height:1}
.medal b small{font-size:10px;letter-spacing:.3em;color:var(--ln);margin-top:4px;margin-left:.3em}
.today .tx .eb{font-family:var(--deco);font-size:11px;letter-spacing:.4em;color:var(--ln)}
.today .tx .big{font-family:var(--serif);font-size:20px;letter-spacing:.12em;line-height:1.4}
.today .tx .sm{font-size:12px;color:var(--ink2)}

.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:14px 16px 0}
.chip{display:block;text-align:center;text-decoration:none;border:1px solid var(--ln);color:var(--ln);padding:7px 0 5px;
  font-family:var(--deco);font-size:13px;line-height:1.1;transition:background .2s,color .2s}
.chip small{display:block;font-size:10px;color:var(--ink2);margin-top:2px}
.chip.on{background:var(--ln);color:var(--on)}
.chip.on small{color:var(--on);opacity:.8}

/* ── Cards ── */
.cards{display:grid;gap:14px;padding:0 16px}
.card .in{padding:16px 18px}
.lb{font-family:var(--deco);font-size:11px;letter-spacing:.38em;color:var(--ln)}
.lb .zh{font-family:var(--sans);letter-spacing:.2em}
.ttl{font-family:var(--serif);font-size:18px;letter-spacing:.06em;margin:6px 0 2px;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:8px 0 2px}
.route .ap{font-family:var(--deco);font-size:34px;line-height:1}
.route .ap small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink2);letter-spacing:.05em;margin-top:4px}
.route .mid{text-align:center;color:var(--ln);font-size:11px}
.route .mid svg{margin:2px auto}
.tm{font-family:var(--deco);font-size:20px;letter-spacing:.04em}
.addr{font-family:var(--serif);font-size:16px;letter-spacing:.04em;margin:4px 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{--c:7px;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--ln);color:var(--on);padding:8px 14px;
  font-size:13px;letter-spacing:.08em;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ln);box-shadow:inset 0 0 0 1px var(--ln)}
.btn svg{width:14px;height:14px}

details.more{margin-top:12px;border-top:1px solid var(--ln2)}
details.more summary{list-style:none;cursor:pointer;padding:10px 0 2px;font-size:12px;letter-spacing:.2em;color:var(--ln);display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:7px;height:7px;border:1px solid var(--ln);transform:rotate(45deg);transition:transform .25s,background .25s}
details.more[open] summary::before{background:var(--ln);transform:rotate(225deg)}
.kv{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.kv li{padding:5px 0;border-bottom:1px dashed var(--ln2)}
.kv li:last-child{border:0}

.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sos a{--c:8px;display:block;text-align:center;text-decoration:none;border:1px solid var(--ln);padding:8px 0 6px;color:var(--ink)}
.sos a b{display:block;font-family:var(--deco);font-weight:400;font-size:24px;color:var(--ln);line-height:1.1}
.sos a span{font-size:11px;letter-spacing:.2em}

/* ── Fan band divider ── */
.band{height:46px;overflow:hidden;margin-top:40px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.band svg{width:100%;height:100%}

/* ── Overview arches ── */
.arches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.arch{position:relative;display:block;aspect-ratio:80/150;text-decoration:none;color:var(--ink)}
.arch svg{position:absolute;inset:0;width:100%;height:100%}
.arch .t{position:absolute;left:0;right:0;bottom:7%;text-align:center}
.arch .t .d{font-family:var(--deco);font-size:13px;color:var(--ln);letter-spacing:.15em}
.arch .t .n{font-family:var(--deco);font-size:19px;line-height:1.1}
.arch .t .th{font-family:var(--serif);font-size:12.5px;letter-spacing:.12em;color:var(--ln);margin-top:3px;padding:0 6px;line-height:1.35}
.arch.today .t .n::after{content:"TODAY";display:block;font-size:9px;letter-spacing:.3em;color:var(--warn);margin-top:2px}

/* ── Day ── */
.day{padding-bottom:10px}
.dhead{position:relative;height:200px;border-bottom:1px solid var(--ln);margin-top:40px}
.dhead>svg{position:absolute;inset:0;width:100%;height:100%}
.window{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:196px;height:166px;background:var(--bg);
  border:1px solid var(--ln);border-bottom:0;border-radius:98px 98px 0 0;text-align:center;padding-top:24px}
.window::before{content:"";position:absolute;inset:5px 5px 0;border:1px solid var(--ln2);border-bottom:0;border-radius:93px 93px 0 0}
.window .eb{font-family:var(--deco);font-size:12px;letter-spacing:.42em;color:var(--ln);margin-left:.42em}
.window .n{font-family:var(--deco);font-size:48px;line-height:1.05}
.window .m{font-family:var(--deco);font-size:11px;letter-spacing:.32em;color:var(--ln)}
.window .th{font-family:var(--serif);font-size:16px;letter-spacing:.14em;margin-top:4px;padding:0 18px;line-height:1.35}
.stay{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--ink2);padding:14px 20px 0;text-align:center}
.stay::before,.stay::after{content:"";flex:1;max-width:46px;height:1px;background:var(--ln2)}
.todo{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0;justify-content:center}
.tag{--c:6px;display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;line-height:1.5}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.no{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--ln2)}
.tag.gold{background:var(--ln);color:var(--on)}
.tag i{width:6px;height:6px;transform:rotate(45deg);background:currentColor;flex-shrink:0}

.tl{list-style:none;margin:22px 0 0;padding:0 16px 0 0;position:relative}
.tl li{display:grid;grid-template-columns:72px 20px 1fr;gap:0 8px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:89px;top:16px;bottom:-2px;width:1px;background:var(--ln2)}
.tl li:last-child::before{display:none}
.tl .t{text-align:right;font-family:var(--deco);font-size:16px;color:var(--ln);line-height:1.25;padding-top:2px}
.tl .t small{display:block;font-size:12px;color:var(--ink2)}
.tl .t em{font-style:normal;font-family:var(--sans);font-size:11px}
.tl .nd{display:flex;justify-content:center;padding-top:7px}
.tl .nd i{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--ln);background:var(--bg);position:relative;z-index:1}
.tl li.meal .nd i{background:var(--ln)}
.tl li.night .nd i{background:var(--fa)}
.tl .x{min-width:0}
.tl .x .h{font-size:15px;line-height:1.5}
.tl li.meal .x .h{font-family:var(--serif);letter-spacing:.04em}
.tl .x .note{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.55}
.tl .x .pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pl a{font-size:11.5px;text-decoration:none;color:var(--ln);border-bottom:1px solid var(--ln2);padding-bottom:1px}
.mealtag{font-family:var(--deco);font-size:10px;letter-spacing:.3em;color:var(--ln);display:block;margin-bottom:-1px}

.boxes{padding:6px 16px 0;display:grid;gap:8px}
details.box{border:1px solid var(--ln2);background:color-mix(in srgb,var(--card) 70%,transparent)}
details.box summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;letter-spacing:.18em}
details.box summary::-webkit-details-marker{display:none}
details.box summary b{font-weight:500}
details.box summary .ct{margin-left:auto;font-family:var(--deco);color:var(--ln);font-size:12px}
details.box summary svg{width:14px;height:14px;transition:transform .25s}
details.box[open] summary svg{transform:rotate(180deg)}
details.box ul{margin:0;padding:0 14px 12px 30px;font-size:13px;color:var(--ink2)}
details.box ul li{padding:3px 0}
details.box ul li::marker{content:"◆  ";color:var(--ln);font-size:8px}
.cta{display:flex;justify-content:center;padding:16px 16px 0}
.dend{display:flex;justify-content:center;padding:26px 0 0}

/* ── Disney ── */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln2);margin:0 16px;border:1px solid var(--ln2)}
.facts div{background:var(--card);padding:10px 12px}
.facts div.wide{grid-column:1/-1}
.facts dt{font-size:11px;letter-spacing:.2em;color:var(--ln)}
.facts dd{margin:2px 0 0;font-size:13.5px}
.stops{list-style:none;margin:22px 0 0;padding:0 16px;display:grid;gap:12px}
.stop .in{padding:14px 16px 14px 16px}
.stop .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stop .when{font-family:var(--deco);font-size:17px;color:var(--ln);letter-spacing:.03em}
.stop .area{font-size:11px;letter-spacing:.25em;color:var(--ink2);text-align:right}
.stop .what{font-family:var(--serif);font-size:16.5px;letter-spacing:.04em;margin:4px 0 8px;line-height:1.5}
.stop .meta{display:flex;flex-wrap:wrap;gap:6px}
.stop .kid,.stop .if{font-size:12.5px;margin-top:8px;padding-left:20px;position:relative;line-height:1.55}
.stop .kid{color:var(--ink)}
.stop .if{color:var(--warn)}
.stop .kid svg,.stop .if svg{position:absolute;left:0;top:3px;width:13px;height:13px}
.stop .src{font-size:11px;margin-top:8px;color:var(--ink2)}
.stop .src a{color:var(--ln)}
.rules{counter-reset:r;list-style:none;margin:0;padding:6px 18px 10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--ln2)}
.rules li:last-child{border:0}
.rules li::before{content:counter(r,upper-roman);font-family:var(--deco);color:var(--ln);font-size:16px}
.rules b{font-weight:500;letter-spacing:.12em;display:block;font-size:14px}
.rules span{font-size:13px;color:var(--ink2)}
.rides{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.ride{--c:10px;border:1px solid var(--ln2);padding:12px;position:relative;background:var(--card)}
.ride.no{opacity:.62}
.ride .z{font-size:10.5px;letter-spacing:.2em;color:var(--ln)}
.ride .nm{font-family:var(--serif);font-size:14.5px;line-height:1.4;margin:3px 0 6px}
.ride .ht{font-family:var(--deco);font-size:13px}
.ride .sg{font-size:11.5px;color:var(--ink2);margin-top:4px}

/* ── Food & places ── */
.sub{display:flex;align-items:center;gap:12px;padding:26px 16px 12px;font-size:13px;letter-spacing:.3em;color:var(--ln)}
.sub::before,.sub::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ln2))}
.sub::after{background:linear-gradient(90deg,var(--ln2),transparent)}
.list{display:grid;gap:10px;padding:0 16px}
.place{--c:9px;border:1px solid var(--ln2);background:var(--card);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.place .nm{font-family:var(--serif);font-size:16px;letter-spacing:.04em}
.place .pr{font-family:var(--deco);color:var(--ln);font-size:14px;text-align:right;white-space:nowrap}
.place .lc{font-size:12px;color:var(--ink2);grid-column:1/-1}
.place .must{font-size:12.5px;grid-column:1/-1;margin-top:4px}
.place .must::before{content:"必點  ";color:var(--ln);letter-spacing:.2em;font-size:11px}
.place .ft{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.place .ft a{margin-left:auto;font-size:12px;color:var(--ln);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.place .ft a svg{width:12px;height:12px}

/* ── Checklist ── */
.prep{padding:0 16px;display:grid;gap:8px}
.prep details.box ul{list-style:none;padding:0 14px 10px}
.prep details.box ul li{padding:8px 0;border-top:1px dashed var(--ln2);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.prep details.box ul li::marker{content:""}
.prep .w{color:var(--ink);font-size:13.5px}
.prep .d{grid-column:1/-1;font-size:12px;white-space:pre-line}
.budget{margin:0 16px;border-collapse:collapse;width:calc(100% - 32px);font-size:13px}
.budget td{padding:9px 4px;border-bottom:1px solid var(--ln2);vertical-align:top}
.budget td:last-child{text-align:right;font-family:var(--deco);font-size:15px;color:var(--ln);white-space:nowrap}
.budget small{display:block;color:var(--ink2);font-size:11.5px}

/* ── Footer, nav, toggles ── */
footer{text-align:center;padding:44px 16px 130px;color:var(--ink2);font-size:12px}
footer .eb{font-family:var(--deco);letter-spacing:.5em;color:var(--ln);font-size:12px;margin:10px 0 4px .5em}
footer button{background:none;border:0;color:var(--ln);text-decoration:underline;cursor:pointer;font-size:12px;margin-top:10px}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);padding:0 0 env(safe-area-inset-bottom)}
nav.bar::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-top:1px solid var(--navln);border-bottom:1px solid var(--navln)}
nav.bar .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.bar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 0 9px;text-decoration:none;color:#9A8F7E;font-size:11px;letter-spacing:.2em;transition:color .2s}
nav.bar a svg{width:22px;height:22px}
nav.bar a.on{color:var(--navln)}
nav.bar a.on svg .acc{fill:var(--navln)}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:21;--c:8px;width:40px;height:40px;border:0;
  background:var(--ln);color:var(--on);display:flex;align-items:center;justify-content:center;cursor:pointer}
.theme svg{width:18px;height:18px}

/* driver card overlay */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.ov.show{display:flex}
.ov .frame{width:100%;max-width:440px}
.ov .in{padding:34px 22px 30px}
.ov .say{font-size:15px;letter-spacing:.3em;color:var(--ln)}
.ov .hn{font-family:var(--serif);font-size:30px;line-height:1.45;margin:16px 0 10px;letter-spacing:.04em}
.ov .ha{font-family:var(--serif);font-size:24px;line-height:1.5}
.ov .hp{font-family:var(--deco);font-size:20px;margin-top:16px;color:var(--ln)}
.ov .x{margin-top:24px}

/* ── Lock screen ── */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
#lock>svg{position:absolute;inset:0;width:100%;height:100%}
#lock .frame{position:relative;width:min(86%,340px)}
#lock .in{padding:26px 22px 24px;text-align:center}
#lock input[type=password]{width:100%;margin-top:18px;background:transparent;border:0;border-bottom:1px solid var(--ln);color:var(--ink);
  font-size:17px;padding:8px 4px;text-align:center;letter-spacing:.2em;outline:none;border-radius:0}
#lock input::placeholder{color:var(--ink2);letter-spacing:.3em;font-size:13px}
#lock label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:14px;cursor:pointer}
#lock input[type=checkbox]{accent-color:var(--ln)}
#lock .btn{margin-top:18px;width:100%;justify-content:center;padding:11px;font-size:14px;letter-spacing:.4em}
#lock .err{color:var(--warn);font-size:12.5px;min-height:20px;margin-top:10px}
#lock.gone{opacity:0;pointer-events:none;transition:opacity .5s}
/* Chamfered outlines: a border can't follow clip-path diagonals, so paint the outline as two clipped layers */
.chip,.btn.ghost,.sos a,.tag.no,.place,.ride{position:relative;isolation:isolate;border:0!important;box-shadow:none!important;background:transparent!important}
.chip::before,.btn.ghost::before,.sos a::before,.tag.no::before,.place::before,.ride::before,
.chip::after,.btn.ghost::after,.sos a::after,.tag.no::after,.place::after,.ride::after{content:"";position:absolute;z-index:-1;
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.chip::before,.btn.ghost::before,.sos a::before,.tag.no::before,.place::before,.ride::before{inset:0;background:var(--bc,var(--ln));z-index:-2}
.chip::after,.btn.ghost::after,.sos a::after,.tag.no::after,.place::after,.ride::after{inset:1px;background:var(--fill,var(--card))}
.chip{--fill:var(--bg)} .chip.on{--fill:var(--ln)}
.place,.ride,.tag.no{--bc:var(--ln2)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="archp" width="28" height="22" patternUnits="userSpaceOnUse">
      <g class="s-ln" stroke-width="1" opacity=".5"><path d="M0 22A14 14 0 0 1 28 22"/><path d="M5 22A9 9 0 0 1 23 22"/><path d="M10 22A4 4 0 0 1 18 22"/></g>
    </pattern>
  </defs>
</svg>

<div id="lock" hidden>
  <svg id="lockbg" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="frame chf"><div class="in chf">
    <div class="deco gd" style="font-size:11px;letter-spacing:.5em">PRIVATE · 私人行程</div>
    <div class="serif" style="font-size:40px;letter-spacing:.4em;margin:6px 0 0 .4em">上海</div>
    <div class="deco gd" style="font-size:20px;letter-spacing:.4em;margin-left:.4em">SHANGHAI</div>
    <form id="lockform" autocomplete="off">
      <input id="pw" type="password" placeholder="輸入密碼" autocomplete="current-password" enterkeyhint="go" required>
      <label><input id="remember" type="checkbox" checked> 記住這支手機</label>
      <button class="btn chf" type="submit">開　啟</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div></div>
</div>

<button class="theme chf" id="theme" type="button" aria-label="切換日夜配色" hidden></button>
<main id="app" class="wrap" hidden></main>

/* ── Helpers ───────────────────────────────────────────── */
function shanghaiToday() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function title(eb, zh, id) {
  return '<div class="st"' + (id ? ' id="' + id + '"' : '') + '><div class="eb">' + eb + '</div><h2>' + zh + '</h2>' + diamondRule(180) + '</div>';
}
function statusTag(s) {
  var cls = /已(預訂|付款|開票|購|完成|確認|兌換|訂)/.test(s) ? 'ok' : /尚未|待|未/.test(s) ? 'warn' : 'no';
  return '<span class="tag chf ' + cls + '"><i></i>' + esc(s) + '</span>';
}
function pick(re, s) { var m = String(s || '').match(re); return m ? m[1] : ''; }

function hero(D, today) {
  var first = D.days[0].date, last = D.days[D.days.length - 1].date, idx = -1;

    tx = '<div class="eb">TODAY · 今日</div><div class="big">' + esc(d.theme) + '</div><div class="sm">點這裡看今天的行程</div>';
  } else if (today < first) {
    var n = daysBetween(today, first);
    medal = '<b>' + n + '<small>DAYS</small></b>';
    tx = '<div class="eb">COUNTDOWN · 倒數</div><div class="big">距離出發還有 ' + n + ' 天</div><div class="sm">10/14 星期三 · 華航 CI503 16:30 起飛</div>';
  } else {
    medal = '<b>∞<small>FIN</small></b>';
    tx = '<div class="eb">BON VOYAGE</div><div class="big">旅程圓滿</div><div class="sm">謝謝上海，下次見</div>';
  }

  var chips = D.days.map(function (d, i) {
    return '<a class="chip chf' + (i === idx ? ' on' : '') + '" style="--c:6px" href="#d' + (i + 1) + '">D' + (i + 1) + '<small>' + d.md + '</small></a>';
  }).join('');

    '<div class="plaque frame chf" style="--c:14px"><div class="in chf" style="--c:14px">' +
    '<div class="eb">— MMXXVI · AUTUMN —</div><div class="zh">上海</div><div class="en">SHANGHAI</div>' +
    '<div style="display:flex;justify-content:center;margin:6px 0 4px">' + diamondRule(200) + '</div>' +

    return '<div class="card frame chf"><div class="in chf">' +

      '<details class="more"><summary>旅客、票號與行李</summary><ul class="kv">' + notes + '</ul></details></div></div>';

    return '<div class="card frame chf"><div class="in chf">' +
      '<div class="row"><div class="lb">HOTEL ' + (['I', 'II', 'III'][i] || '') + ' · <span class="zh">住宿</span></div><div class="deco gd" style="font-size:13px">' + esc(nights) + '</div></div>' +
      '<div class="ttl">' + esc(h['飯店名稱']) + '</div><div class="addr">上海市' + esc(h['區域']) + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + statusTag(h['預訂狀態']) + (conf ? '<span class="tag chf no">確認編號 ' + esc(conf) + '</span>' : '') + '</div>' +
      '<div class="btns"><button class="btn chf" data-driver="' + i + '">' + ICON.car + '給司機看</button>' +
      '<a class="btn chf ghost" href="' + amap(h['飯店名稱']) + '" target="_blank" rel="noopener">' + ICON.map + '高德導航</a>' +

      '<div class="lc">' + esc(a['區域']) + '　·　' + esc(a['類型']) + '　·　停留 ' + esc(a['建議停留']) + '</div>' +
      (a['推薦原因'] ? '<div class="must" style="color:var(--ink2)">' + esc(a['推薦原因']) + '</div>' : '') +
      '<div class="ft"><span class="tag chf ' + (a['你的評選'] === '想去' ? 'gold' : 'no') + '">' + esc(a['你的評選']) + '</span>' +
      '<a href="' + amap(a['景點名稱'].replace('＋', '／').split('／')[0]) + '" target="_blank" rel="noopener">' + ICON.map + '高德</a></div></div>';
  }).join('');
  return '<section id="food"><div class="band">' + fans(432, 46, 16, 12) + '</div>' + title('DINING &amp; SIGHTS', '美食與景點') +
    '<div class="sub" style="padding-top:0">已排入行程</div><div class="list">' + inPlan.map(card).join('') + '</div>' +
    '<div class="sub">口袋名單</div><div class="list">' + rest.map(card).join('') + '</div>' +
    '<div class="sub">景點</div><div class="list">' + spots + '</div></section>';
}

function prep(D) {
  var groups = {};
  D.todos.forEach(function (t) { var g = t['分類'].split('－')[0]; (groups[g] = groups[g] || []).push(t); });
  var boxes = Object.keys(groups).map(function (g) {
    var items = groups[g], open = items.filter(function (t) { return !/已/.test(t['狀態']); }).length;
    return '<details class="box"' + (g === '票券' || g === '餐廳訂位' ? ' open' : '') + '><summary><b>' + esc(g) + '</b><span class="ct">' + open + ' / ' + items.length + '</span>' + ICON.down + '</summary><ul>' +
      items.map(function (t) {
        var who = t['分類'].indexOf('－') > 0 ? t['分類'].split('－')[1] + '・' : '';
        return '<li><span class="w">' + esc(who + t['待辦事項']) + '</span>' + statusTag(t['狀態']) + '<span class="d mut">' + esc(t['重要資料／編號']) + (t['截止日期'] ? '　（截止 ' + esc(t['截止日期'].slice(5)) + '）' : '') + '</span></li>';
      }).join('') + '</ul></details>';
  }).join('');
  var budget = D.budget.map(function (b) {
    return '<tr><td>' + esc(b['項目']) + '<small>' + esc(b['付款狀態']) + '</small></td><td>' + esc(b['實際幣別']) + ' ' + esc(b['實際金額']) + '</td></tr>';
  }).join('');
  return '<section id="prep"><div class="band">' + fans(432, 46, 16, 12) + '</div>' + title('BEFORE YOU GO', '行前清單') +
    '<div class="prep">' + boxes + '</div><div class="sub">已知支出</div><table class="budget">' + budget + '</table></section>';
}

/* ── Interactions ─────────────────────────────────────── */
function driverCard(h) {
  var phone = pick(/(\+86[-\d]+)/, h['備註']);
  var ov = $('#driver');
  ov.innerHTML = '<div class="frame chf" style="--c:16px"><div class="in chf" style="--c:16px">' +
    '<div class="say">' + sc('師傅，請送我們到') + '</div>' + '<div style="display:flex;justify-content:center;margin-top:10px">' + diamondRule(160) + '</div>' +
    '<div class="hn">' + esc(sc(h['飯店名稱'])) + '</div><div class="ha">' + esc(sc('上海市' + h['區域'])) + '</div>' +
    (phone ? '<div class="hp">' + esc(phone) + '</div>' : '') + '<div class="mut" style="font-size:13px;margin-top:6px">' + sc('謝謝！') + '</div>' +
    '<button class="btn chf ghost x" type="button">關閉</button></div></div>';
  ov.classList.add('show');
  $('.x', ov).onclick = function () { ov.classList.remove('show'); };
}

function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#theme').innerHTML = dark ? ICON.sun : ICON.moon;
  $('meta[name=theme-color]').setAttribute('content', dark ? '#0B1512' : '#EDE1D3');
}
function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem('trip-theme'); } catch (e) {}
  setTheme(saved);
  $('#theme').hidden = false;
  $('#theme').onclick = function () {
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('trip-theme', next); } catch (e) {}
    setTheme(next);
  };
}

function render(D) {
  SC = D.sc || {};
  var today = shanghaiToday();
  var app = $('#app');
  app.innerHTML = hero(D, today) + essentials(D) + overview(D, today) + days(D) + disney(D) + food(D) + prep(D) +
    '<footer><div style="display:flex;justify-content:center">' + chevronRule() + '</div><div class="eb">SHANGHAI · MMXXVI</div>' +
    '<div>資料更新於 ' + esc(D.built) + '（上海時間）</div>' +
    (window.TRIP_SEALED ? '<button type="button" id="forget">鎖上並忘記這支手機</button>' : '') + '</footer>';
  app.hidden = false;

  var nav = $('#nav .wrap');
  nav.innerHTML = NAV.map(function (n) { return '<a href="#' + n[0] + '" data-k="' + n[0] + '">' + n[2] + n[1] + '</a>'; }).join('');
  $('#nav').hidden = false;
  var map = {top: 'top', info: 'top', days: 'days', disney: 'disney', food: 'food', prep: 'prep'};
  D.days.forEach(function (_, i) { map['d' + (i + 1)] = 'days'; });
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var k = map[e.target.id];
      nav.querySelectorAll('a').forEach(function (a) { a.classList.toggle('on', a.dataset.k === k); });
    });
  }, {rootMargin: '-45% 0px -50% 0px'});
  Object.keys(map).forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-driver]');
    if (b) driverCard(D.hotels[+b.dataset.driver]);
    if (e.target.id === 'forget') {
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('trip-key:') === 0) localStorage.removeItem(k); }); } catch (x) {}
      location.reload();
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#driver').classList.remove('show'); });
  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
}

/* ── Unlock ───────────────────────────────────────────── */
var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
var ub64 = function (u) { var s = ''; new Uint8Array(u).forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s); };
function decryptWith(key, S) {
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(S.iv)}, key, b64(S.ct)).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
function deriveKey(pw, S) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(S.salt), iterations: S.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
  });
}
function showLock(S) {
  var lock = $('#lock');
  $('#lockbg').setAttribute('viewBox', '0 0 400 800');
  $('#lockbg').innerHTML = '<rect width="400" height="800" class="fl-bg"/>' + rays(200, 400, 48, 700, .12);
  lock.hidden = false;
  if (!window.crypto || !crypto.subtle) {
    $('#err').textContent = '這個瀏覽器無法解鎖，請改用 Safari 或 Chrome 開啟網址。';
    return;
  }
  var store = 'trip-key:' + S.salt;
  $('#lockform').onsubmit = function (e) {
    e.preventDefault();
    var btn = $('#lockform button'); btn.disabled = true; btn.textContent = '解鎖中…'; $('#err').textContent = '';
    var key;
    deriveKey($('#pw').value, S).then(function (k) { key = k; return decryptWith(k, S); }).then(function (D) {
      if ($('#remember').checked) crypto.subtle.exportKey('raw', key).then(function (raw) { try { localStorage.setItem(store, ub64(raw)); } catch (x) {} });
      lock.classList.add('gone'); setTimeout(function () { lock.hidden = true; }, 500);
      render(D);
    }).catch(function () {
      $('#err').textContent = '密碼不正確，請再試一次。'; btn.disabled = false; btn.textContent = '開　啟'; $('#pw').select();
    });
  };
  setTimeout(function () { $('#pw').focus(); }, 50);
}

initTheme();
if (window.TRIP_PLAIN) {
  render(window.TRIP_PLAIN);
} else if (window.TRIP_SEALED) {
  var S = window.TRIP_SEALED, saved = null;
  try { saved = localStorage.getItem('trip-key:' + S.salt); } catch (e) {}
  if (saved && window.crypto && crypto.subtle) {
    crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']).then(function (k) { return decryptWith(k, S); })
      .then(render).catch(function () { showLock(S); });
  } else {
    showLock(S);
  }
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
